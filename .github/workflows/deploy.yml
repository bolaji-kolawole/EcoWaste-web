name: 🚀 Deploy React App to cPanel

on:
  push:
    branches:
      - main   # or your deployment branch

jobs:
  deploy:
    name: Upload React build to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # your React app's Node version

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build React app
        run: npm run build

      - name: 📤 Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp  # change to sftp if your host supports it
          server-dir: ${{ secrets.FTP_PATH }}/   # this is required
          local-dir: ./dist/                    # upload only the build folder
          exclude: |
            **/.git*
            **/.github*
            node_modules/**
            **/src/**
            **/tests/**
            **/*.env